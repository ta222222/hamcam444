<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hammercam">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>hammercam 4.0</title>
  <style>
    :root {
      --fg: #f5f5f5;
      --border: rgba(255, 255, 255, 0.28);
      --muted: rgba(255, 255, 255, 0.7);
      --muted-light: rgba(255, 255, 255, 0.45);
      --neon: #c8ff00;
      --neon-dim: #b8eb00;
      --danger: #ff7b7b;
      --radius: 4px;
      --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
      --safe-t: max(14px, env(safe-area-inset-top, 0px));
      --safe-r: max(14px, env(safe-area-inset-right, 0px));
      --safe-b: max(14px, env(safe-area-inset-bottom, 0px));
      --safe-l: max(14px, env(safe-area-inset-left, 0px));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 11px;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }

    #video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #view {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: #111;
      display: none;
    }

    #view.mirrored { transform: scaleX(-1); }
    body.is-live #view { display: block; }

    .idle {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(320px, calc(100% - 40px));
      text-align: center;
      padding: 28px 22px;
      background: rgba(12, 12, 12, 0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    body.is-live .idle { display: none; }

    .idle h1 {
      font: 700 13px/1.2 var(--font-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .idle p {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 18px;
      font-size: 10px;
    }

    .btn {
      appearance: none;
      -webkit-appearance: none;
      font: 700 11px/1 var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      min-height: 42px;
      padding: 0 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.1);
      color: var(--fg);
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn-primary {
      background: var(--neon);
      border-color: var(--neon-dim);
      color: #0a0a0a;
      width: 100%;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .btn-sm {
      min-height: 32px;
      padding: 0 10px;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-sm.primary {
      background: var(--neon);
      border-color: var(--neon-dim);
      color: #0a0a0a;
    }

    .hud {
      position: absolute;
      z-index: 10;
      display: none;
      gap: 8px;
      pointer-events: none;
    }

    body.is-live .hud { display: flex; }

    .hud > * { pointer-events: auto; }

    .hud-top {
      position: absolute;
      top: var(--safe-t);
      left: var(--safe-l);
      right: var(--safe-r);
      display: none;
      justify-content: space-between;
      align-items: center;
    }

    body.is-live .hud-top { display: flex; }

    .hud-bottom {
      position: absolute;
      bottom: var(--safe-b);
      left: var(--safe-l);
      right: var(--safe-r);
      display: none;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
    }

    body.is-live .hud-bottom {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
    }

    .hud-bottom-left,
    .hud-bottom-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hud-bottom-left {
      justify-content: flex-start;
    }

    .hud-bottom-mid {
      display: flex;
      justify-content: center;
    }

    .hud-bottom-right {
      justify-content: flex-end;
    }

    body.chrome-hidden .hud-chrome {
      display: none !important;
    }

    body.chrome-hidden .overlay {
      display: none !important;
    }

    body.chrome-hidden .hud-top {
      justify-content: flex-end;
    }

    .hud-zoom {
      position: absolute;
      z-index: 16;
      left: 50%;
      bottom: calc(var(--safe-b) + 84px);
      transform: translateX(-50%);
      display: none !important;
      gap: 0;
      align-items: center;
      background: rgba(10, 10, 10, 0.72);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      pointer-events: auto;
      max-width: calc(100vw - 24px);
    }

    body.is-live .hud-zoom {
      display: flex !important;
    }

    body.chrome-hidden .hud-zoom {
      display: none !important;
    }

    .hud-zoom .hud-btn {
      min-width: 44px;
      min-height: 40px;
      padding: 0 11px;
      border: none;
      border-radius: 0;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .hud-zoom .hud-btn + .hud-btn {
      border-left: 1px solid var(--border);
    }

    .hud-zoom .hud-btn.active {
      background: var(--neon);
      color: #0a0a0a;
    }

    .hud-btn {
      min-width: 44px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(10, 10, 10, 0.55);
      color: var(--fg);
      font: 700 11px/1 var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      touch-action: manipulation;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .hud-btn.icon {
      width: 44px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .hud-btn.primary {
      background: color-mix(in srgb, var(--neon) 80%, transparent);
      border-color: var(--neon-dim);
      color: #0a0a0a;
    }

    body.controls-open #toggle-controls {
      background: var(--neon);
      border-color: var(--neon-dim);
      color: #0a0a0a;
    }

    .toast {
      position: absolute;
      z-index: 12;
      left: 50%;
      top: calc(var(--safe-t) + 52px);
      bottom: auto;
      transform: translateX(-50%);
      max-width: min(90vw, 360px);
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 10px;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .toast.error { color: var(--danger); }
    .toast:empty { display: none; }

    .overlay {
      position: absolute;
      z-index: 11;
      left: var(--safe-l);
      right: var(--safe-r);
      bottom: calc(var(--safe-b) + 100px);
      margin: 0 auto;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      gap: 11px;
      max-height: min(52dvh, 400px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
    }

    body.controls-open .overlay { display: flex; }

    .overlay-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .rail {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted-light);
    }

    .badge {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 8px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .ctrl {
      display: grid;
      grid-template-columns: 5.4rem minmax(0, 1fr) 2.6rem;
      align-items: center;
      gap: 8px;
    }

    .ctrl label {
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-light);
    }

    .ctrl output {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 10px;
    }

    .ctrl input[type="range"] {
      width: 100%;
      accent-color: var(--neon-dim);
      touch-action: none;
    }

    .ctrl select {
      width: 100%;
      padding: 8px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--fg);
      font: 10px/1.3 var(--font-mono);
    }

    .offline-pill {
      position: absolute;
      z-index: 20;
      top: calc(var(--safe-t) + 52px);
      left: 50%;
      transform: translateX(-50%);
      display: none;
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.7);
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }

    body.is-offline .offline-pill { display: block; }

    .mode-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      overflow: hidden;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.55);
    }

    .mode-toggle .hud-btn {
      min-width: 56px;
      min-height: 32px;
      border: none;
      border-radius: 0;
      background: transparent;
      backdrop-filter: none;
      font-size: 9px;
    }

    .mode-toggle .hud-btn.active {
      background: var(--neon);
      color: #0a0a0a;
    }

    .shutter-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: transparent;
      padding: 4px;
      cursor: pointer;
      touch-action: none;
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.12s ease, border-radius 0.12s ease, background 0.12s ease;
    }

    .shutter:active .shutter-inner {
      transform: scale(0.88);
    }

    body.mode-video .shutter-inner {
      background: #e04545;
    }

    body.is-recording .shutter {
      border-color: #e04545;
    }

    body.is-recording .shutter-inner {
      width: 42%;
      height: 42%;
      border-radius: 6px;
      background: #e04545;
      transform: none;
    }

    .rec-timer {
      display: none;
      font: 700 11px/1 var(--font-mono);
      letter-spacing: 0.08em;
      color: #ff7b7b;
      min-height: 12px;
    }

    body.is-recording .rec-timer { display: block; }

    .shutter-hint {
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-light);
      text-align: center;
      max-width: 120px;
    }

    .hud-bottom {
      bottom: var(--safe-b);
      align-items: flex-end;
    }

    .hud-bottom-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="video" playsinline webkit-playsinline muted autoplay></video>
    <canvas id="view" aria-label="dithered camera"></canvas>

    <div class="idle" id="idle">
      <h1>hammercam 4.0</h1>
      <p>Offline dither camera. Tap shutter for a photo, hold to record video — save to Photos via the share sheet.</p>
      <button type="button" class="btn btn-primary" id="start-btn">Start camera</button>
    </div>

    <div class="offline-pill" id="offline-pill">Offline · cached</div>

    <div class="hud hud-top" id="hud-top">
      <button type="button" class="hud-btn hud-chrome" id="flip-btn">Flip</button>
      <span class="badge hud-chrome" id="facing-badge" style="align-self:center">rear</span>
      <button type="button" class="hud-btn icon" id="stop-btn" aria-label="Stop">×</button>
    </div>

    <div class="hud hud-zoom hud-chrome" id="zoom-bar" role="group" aria-label="Camera zoom">
      <button type="button" class="hud-btn" data-zoom="0.5" title="Ultra-wide / fisheye">0.5</button>
      <button type="button" class="hud-btn active" data-zoom="1">1×</button>
      <button type="button" class="hud-btn" data-zoom="2">2×</button>
      <button type="button" class="hud-btn" data-zoom="4">4×</button>
      <button type="button" class="hud-btn" data-zoom="6">6×</button>
    </div>

    <div class="hud hud-bottom hud-chrome" id="hud-bottom">
      <div class="hud-bottom-left">
        <div class="mode-toggle" id="mode-toggle" role="group" aria-label="Capture mode">
          <button type="button" class="hud-btn active" data-mode="photo" id="mode-photo">Photo</button>
          <button type="button" class="hud-btn" data-mode="video" id="mode-video">Video</button>
        </div>
      </div>
      <div class="hud-bottom-mid">
        <div class="shutter-wrap">
          <div class="rec-timer" id="rec-timer">00:00</div>
          <button type="button" class="shutter" id="shutter" aria-label="Shutter">
            <span class="shutter-inner" aria-hidden="true"></span>
          </button>
          <div class="shutter-hint" id="shutter-hint">Tap photo · hold video</div>
        </div>
      </div>
      <div class="hud-bottom-right">
        <button type="button" class="hud-btn" id="toggle-chrome" aria-label="Hide controls">Hide</button>
        <button type="button" class="hud-btn" id="toggle-controls">Ctrl</button>
      </div>
    </div>

    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="overlay-head">
        <p class="rail">Output settings</p>
        <button type="button" class="btn btn-sm" id="hide-controls">Hide</button>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-sm" id="reset-btn">Reset</button>
        <button type="button" class="btn btn-sm primary" id="snap-btn-2">Photo → Photos</button>
      </div>

      <div class="ctrl">
        <label for="preset">Preset</label>
        <select id="preset">
          <option value="default">Default</option>
          <option value="v1">V1 G00D</option>
          <option value="soft">Soft</option>
          <option value="hard">Hard</option>
          <option value="test4444">test4444</option>
        </select>
        <span></span>
      </div>
      <div class="ctrl">
        <label for="pixel">Pixel</label>
        <input type="range" id="pixel" min="0.2" max="3" step="0.01" value="0.75">
        <output id="pixel-val" for="pixel">0.75</output>
      </div>
      <div class="ctrl">
        <label for="threshold">Threshold</label>
        <input type="range" id="threshold" min="40" max="215" step="1" value="128">
        <output id="threshold-val" for="threshold">128</output>
      </div>
      <div class="ctrl">
        <label for="contrast">Contrast</label>
        <input type="range" id="contrast" min="0.5" max="3" step="0.05" value="1.2">
        <output id="contrast-val" for="contrast">1.20</output>
      </div>
      <div class="ctrl">
        <label for="strength">Strength</label>
        <input type="range" id="strength" min="0" max="2" step="0.05" value="1">
        <output id="strength-val" for="strength">1.00</output>
      </div>
    </div>

    <div class="toast" id="toast" aria-live="polite"></div>
  </div>

  <script>
    (function () {
      'use strict';

      var presets = {
        default: { pixel: 0.75, threshold: 128, contrast: 1.2, strength: 1 },
        v1: { pixel: 0.35, threshold: 40, contrast: 2.25, strength: 0.65 },
        soft: { pixel: 1.25, threshold: 140, contrast: 0.9, strength: 0.75 },
        hard: { pixel: 0.9, threshold: 100, contrast: 2.0, strength: 1.25 },
        test4444: { pixel: 0.22, threshold: 44, contrast: 1.55, strength: 0.11 }
      };

      var video = document.getElementById('video');
      var view = document.getElementById('view');
      var toastEl = document.getElementById('toast');
      var overlay = document.getElementById('overlay');
      var facingBadge = document.getElementById('facing-badge');
      var startBtn = document.getElementById('start-btn');
      var stopBtn = document.getElementById('stop-btn');
      var flipBtn = document.getElementById('flip-btn');
      var snapBtn2 = document.getElementById('snap-btn-2');
      var resetBtn = document.getElementById('reset-btn');
      var toggleControlsBtn = document.getElementById('toggle-controls');
      var toggleChromeBtn = document.getElementById('toggle-chrome');
      var hideControlsBtn = document.getElementById('hide-controls');
      var stageEl = document.getElementById('stage');
      var zoomBar = document.getElementById('zoom-bar');
      var shutterBtn = document.getElementById('shutter');
      var shutterHint = document.getElementById('shutter-hint');
      var recTimerEl = document.getElementById('rec-timer');
      var modePhotoBtn = document.getElementById('mode-photo');
      var modeVideoBtn = document.getElementById('mode-video');
      var toastTimer = 0;
      var presetEl = document.getElementById('preset');
      var pixelEl = document.getElementById('pixel');
      var thresholdEl = document.getElementById('threshold');
      var contrastEl = document.getElementById('contrast');
      var strengthEl = document.getElementById('strength');
      var pixelVal = document.getElementById('pixel-val');
      var thresholdVal = document.getElementById('threshold-val');
      var contrastVal = document.getElementById('contrast-val');
      var strengthVal = document.getElementById('strength-val');

      var work = document.createElement('canvas');
      var wctx = work.getContext('2d', { willReadFrequently: true, alpha: false });
      var vctx = view.getContext('2d', { alpha: false });
      var exportWork = document.createElement('canvas');
      var exportOut = document.createElement('canvas');
      var gray = null;

      var stream = null;
      var facingMode = 'environment';
      var running = false;
      var starting = false;
      var raf = 0;
      var processing = false;
      var adaptiveMaxW = 360;
      var lockedKey = '';
      var lastPixel = -1;
      var zoomFactor = 1;
      var zoomAnim = 1;
      var fisheyeBuf = null;
      var fisheyeTmp = document.createElement('canvas');
      var fisheyeCtx = fisheyeTmp.getContext('2d', { willReadFrequently: true, alpha: false });

      function settings() {
        return {
          pixel: +pixelEl.value,
          threshold: +thresholdEl.value,
          contrast: +contrastEl.value,
          strength: +strengthEl.value
        };
      }

      function syncLabels() {
        var s = settings();
        pixelVal.textContent = s.pixel.toFixed(2);
        thresholdVal.textContent = String(s.threshold);
        contrastVal.textContent = s.contrast.toFixed(2);
        strengthVal.textContent = s.strength.toFixed(2);
      }

      function toast(msg, isError) {
        if (toastTimer) {
          clearTimeout(toastTimer);
          toastTimer = 0;
        }
        toastEl.textContent = msg || '';
        toastEl.classList.toggle('error', !!isError);
      }

      function toastTemp(msg, ms, isError) {
        toast(msg, isError);
        toastTimer = setTimeout(function () {
          toastEl.textContent = '';
          toastTimer = 0;
        }, ms || 1400);
      }

      function setChromeHidden(hidden) {
        document.body.classList.toggle('chrome-hidden', !!hidden);
        if (hidden) setControlsOpen(false);
      }

      function applySettings(s) {
        pixelEl.value = s.pixel;
        thresholdEl.value = s.threshold;
        contrastEl.value = s.contrast;
        strengthEl.value = s.strength;
        syncLabels();
      }

      function setControlsOpen(open) {
        document.body.classList.toggle('controls-open', open);
        toggleControlsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
        overlay.setAttribute('aria-hidden', open ? 'false' : 'true');
      }

      function syncFacingUi() {
        var rear = facingMode === 'environment';
        facingBadge.textContent = rear ? 'rear' : 'front';
        view.classList.toggle('mirrored', !rear);
      }

      function syncZoomUi() {
        var buttons = zoomBar.querySelectorAll('[data-zoom]');
        for (var i = 0; i < buttons.length; i++) {
          var btn = buttons[i];
          btn.classList.toggle('active', Math.abs(+btn.getAttribute('data-zoom') - zoomFactor) < 0.001);
        }
      }

      function setZoom(factor) {
        zoomFactor = factor;
        syncZoomUi();
        toastTemp(factor === 0.5 ? '0.5× wide' : factor + '×', 800);
      }

      // Pure JS zoom — center crop for 1×+, faux fisheye wide for 0.5×
      function drawVideoFrame(ctx, destW, destH) {
        var vw = video.videoWidth || destW;
        var vh = video.videoHeight || destH;
        if (vw < 2 || vh < 2) return;

        // Smooth toward selected zoom (iPhone-like)
        zoomAnim += (zoomFactor - zoomAnim) * 0.22;
        if (Math.abs(zoomAnim - zoomFactor) < 0.004) zoomAnim = zoomFactor;

        var z = zoomAnim;

          height: { ideal: 1080 }

            audio: false,
            video: {

      });

      shutterBtn.addEventListener('pointerdown', onShutterDown);
      shutterBtn.addEventListener('pointerup', onShutterUp);
      shutterBtn.addEventListener('pointercancel', onShutterUp);
      shutterBtn.addEventListener('pointerleave', function (e) {
        if (shutterArmed) onShutterUp(e);
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          if (recording) requestStopRecording();
          else if (document.body.classList.contains('chrome-hidden')) setChromeHidden(false);
          else if (document.body.classList.contains('controls-open')) setControlsOpen(false);
          else if (running) stopCamera();
        } else if ((e.key === ' ' || e.key === 'Enter') && running && !starting) {
          if (e.repeat) return;
          e.preventDefault();
          if (captureMode === 'video') {
            if (recording) requestStopRecording();
            else startRecording();
          } else {
            takePhoto();
          }
        }
      });

      window.addEventListener('online', syncOfflineUi);
      window.addEventListener('offline', syncOfflineUi);
      syncOfflineUi();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('SW register failed', err);
        });
      }

      applySettings(presets.default);
      presetEl.value = 'default';
      syncZoomUi();
      setCaptureMode('photo');
      setRunningUi(false);
      setControlsOpen(false);
      toast('hammercam 4.0 — start camera · works offline after first load');
    })();
  </script>
</body>
</html>
